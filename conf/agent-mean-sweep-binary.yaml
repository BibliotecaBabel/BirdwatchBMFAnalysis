defaults:
  - /base
  - override hydra/launcher: joblib
  - _self_

project_name: agent-mean-sweep-binary
save_folder: data/agent-mean-sweep-binary
replications: 10

# modifications to make the training stable with binary ratings
dg:
  binary_ratings: true

model:
  loss_type: log_loss

training:
  learning_rate: 0.01

hydra:
  sweeper:
    params:
      dg.user_distribution.mean: ${linspace:-2,2,11}
      model.regularization_type: l2
      model.reg_lambda: 0.01, 0.05, 0.1
      # model.reg_intercept_multiplier: 0.2, 1.0, 5.0
      model.reg_intercept_multiplier: 1.0
