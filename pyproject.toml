[tool.poetry]
name = "bmf"
version = "1.0.0"
description = "Simulations and figures for \"Can Ideologues Agree on Quality? From Non-identifiable Latent Factors to Collective Outcomes\" (NeurIPS 2026)"
authors = ["David Gamba", "Seura Ha", "Daniel M. Romero", "Grant Schoenebeck"]
license = "MIT"
readme = "README.md"
packages = [{ include = "bmf", from = "src" }]

# The versions below are the ones the paper's runs were made with.
[tool.poetry.dependencies]
python = ">=3.12,<3.14"
numpy = "2.2.2"
pandas = "2.2.3"
scipy = "1.15.1"
matplotlib = "3.10.0"
seaborn = "0.13.2"
torch = "2.6.0"
pytorch-lightning = "2.5.0.post0"
hydra-core = "1.3.2"
hydra-joblib-launcher = "1.2.0"
omegaconf = "2.3.0"
joblib = "1.4.2"
numba = "0.63.1"
dask = { version = "2025.12.0", extras = ["dataframe"] }
pyarrow = "19.0.1"
python-dotenv = "1.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
